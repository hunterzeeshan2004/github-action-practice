# Goal: Build the image for DevBoard Fronted and Push to docker Hub
name: CI

on:
  push:
   branches: [master]

jobs:
  build-and-push:
   runs-on: ubuntu-latest
   steps:
    - name: Checkout code
      uses: action/checkout@v7

    - name: Docker Setup [Login]
      uses: action/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
